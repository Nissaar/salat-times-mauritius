<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="moonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c9a227;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e6c65a;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a5f4a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#134539;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bgGrad)"/>
  
  <!-- Crescent moon -->
  <path d="M50 10 
           C30 10 15 30 15 50 
           C15 70 30 90 50 90 
           C35 80 30 65 30 50 
           C30 35 35 20 50 10 Z" 
        fill="url(#moonGrad)"/>
  
  <!-- Star -->
  <polygon points="70,35 72,41 78,41 73,45 75,51 70,47 65,51 67,45 62,41 68,41" 
           fill="url(#moonGrad)"/>
  
  <!-- Small decorative stars -->
  <circle cx="58" cy="25" r="1.5" fill="#c9a227"/>
  <circle cx="80" cy="55" r="1.5" fill="#c9a227"/>
  <circle cx="75" cy="70" r="1" fill="#c9a227"/>
</svg>
